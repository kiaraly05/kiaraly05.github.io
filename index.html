<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolios de Kiara Peralta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Elsie+Swash+Caps:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="particle-canvas"></canvas>

    <main class="main-content">
         <header class="tittle">
                <h1>Kiara Peralta</h1>
                <p>Portafolios de Código Creativo</p>
         </header>
         <nav>
                <ul>
                        <li class="item-list"><a href="https://kiaraly05.github.io/pelota_que_rebota/" target="_blank">Pelota que Rebota</a></li>
                        <li class="item-list"><a href="https://kiaraly05.github.io/interaccion_manos_camara/" target="_blank">Fotomatón por Gestos</a></li>
                        <li class="item-list"><a href="" target="_blank">Proyecto 3</a></li>
                        <li class="item-list"><a href="" target="_blank">Proyecto 4</a></li>
                </ul>
         </nav>
    </main>

    <script>
        /* Sistema de partículas: corazones translúcidos que salen del mouse y se destruyen a los 3 segundos */
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const MAX_PARTICLES = 90;
        const LIFE_MS = 3000; // 3 segundos
        const mouse = { x: -1000, y: -1000 };
        let lastEmit = 0;

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function drawHeart(x, y, size) {
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.bezierCurveTo(x - size * 0.6, y - size * 0.35, x - size * 0.9, y + size * 0.15, x, y + size * 0.85);
            ctx.bezierCurveTo(x + size * 0.9, y + size * 0.15, x + size * 0.6, y - size * 0.35, x, y);
            ctx.closePath();
            ctx.fill();
        }

        function emit(now) {
            if (now - lastEmit < 150) return; // emisión más espaciada = más suave
            lastEmit = now;
            if (particles.length >= MAX_PARTICLES) return;
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * 0.9 + 0.25;
            particles.push({
                x: mouse.x + (Math.random() - 0.5) * 18,
                y: mouse.y + (Math.random() - 0.5) * 18,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 0.5,
                life: LIFE_MS,
                maxLife: LIFE_MS,
                size: Math.random() * 14 + 5, // tamaños variados (5 a 19)
                opacity: Math.random() * 0.3 + 0.1, // translúcido y suave
            });
        }

        function update(now) {
            ctx.clearRect(0, 0, width, height);
            emit(now);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= 16;
                const t = p.life / p.maxLife; // 1 -> 0

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.018; // gravedad más suave
                p.vx *= 0.96;
                p.vy *= 0.96;

                ctx.save();
                ctx.globalAlpha = p.opacity * t;
                ctx.fillStyle = '#00e5ff';
                drawHeart(p.x, p.y, p.size * t);
                ctx.restore();

                if (p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(update);
        }

        requestAnimationFrame(update);
    </script>
</body>
</html>
